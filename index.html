<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c120b" />
    <title>ビールジョッキ</title>
    <!-- ファビコンとホーム画面のアイコン（scripts/icon.mjs で作る）。/… と書くと Vite が ./… に直す -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="スマホがビールジョッキに。傾けるとゴクゴク飲めて、振ると泡が立つ。" />
    <!-- Facebook・X・LINE などで URL を共有したときのプレビュー（画像は scripts/og.mjs で作る）。
         画像の URL は絶対 URL で書く（/og.jpg や ./og.jpg と書くと、Vite が相対パスに書き換えてしまい、読んでもらえない） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ビールジョッキ" />
    <meta property="og:title" content="ビールジョッキ" />
    <meta property="og:description" content="スマホがビールジョッキに。傾けるとゴクゴク飲めて、振ると泡が立つ。" />
    <meta property="og:url" content="https://kawade502.github.io/beer-jug/" />
    <meta property="og:image" content="https://kawade502.github.io/beer-jug/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="泡の立ったビールジョッキと「ビールジョッキ　スマホを傾けて、ゴクゴク飲もう」の文字" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image:alt" content="泡の立ったビールジョッキと「ビールジョッキ　スマホを傾けて、ゴクゴク飲もう」の文字" />
  </head>
  <body>
    <!-- 画面が自動で横向きになっても、中身はスマホ本体に貼り付いたまま（main.js の layout() で逆に回す） -->
    <div id="app">
      <canvas id="stage"></canvas>
      <button type="button" class="round mute" id="mute" aria-pressed="false" aria-label="音を消す">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="speaker" d="M4 9h3l5-4v14l-5-4H4z" />
          <path class="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" />
          <path class="cross" d="M16 9l6 6M22 9l-6 6" />
        </svg>
      </button>
      <button type="button" class="round level" id="level" aria-label="今の持ち方をまっすぐにする" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 15h18" />
          <path d="M7 15c0-3 2.2-5 5-5s5 2 5 5" />
          <circle cx="12" cy="15" r="1.6" />
        </svg>
      </button>
      <div class="hint" id="hint" data-state="pour">
        <p class="line">
          <span class="msg" data-for="pour">注いでいます…</span>
          <span class="msg" data-for="ready touch">スマホを傾けて、ぐいっと飲もう。振ると泡が立つよ</span>
          <span class="msg" data-for="ready mouse">ドラッグか矢印キーで傾けて飲もう。素早く左右に振るか S キーで泡が立つよ</span>
          <span class="msg" data-for="drinking">ゴクゴク…</span>
          <span class="msg" data-for="empty">ぷはー、ごちそうさま！</span>
          <span class="msg" data-for="level">今の持ち方を「まっすぐ」にしました</span>
          <span class="msg" data-for="nosensor">傾きセンサーが使えないので、ドラッグで傾けてね</span>
          <span class="msg" data-for="hold">縦に持って「乾杯！」をタップすると、ジョッキがスマホにくっつきます</span>
          <span class="msg" data-for="rotate">画面がくるっと回るときは、画面の回転をロックしてね（iPhone はコントロールセンターの「画面縦向きのロック」）</span>
          <span class="left" id="left"></span>
          <button type="button" id="again">おかわり</button>
        </p>
      </div>
      <button type="button" class="cheers" id="cheers">
        <span class="big">乾杯！</span>
        <span class="small touch">タップで音と傾きセンサーがオンになります</span>
        <span class="small mouse">クリックで音がオンになります</span>
      </button>
      <p class="error" id="error" hidden>この端末では WebGL2 が使えないため表示できません。</p>
    </div>
    <script type="module" src="./src/main.js"></script>
    <!-- アクセス数（Cloudflare Web Analytics。Cookie を使わない）。トークンは XBill と同じ（同じ kawade502.github.io のサイト）。
         公開ページでだけ読み込む（localhost の vite・vite preview・Playwright のテストや、?test では数えない） -->
    <script>
      if (location.hostname === 'kawade502.github.io' && !new URLSearchParams(location.search).has('test')) {
        const token = '34c626b8f1b04253a2e2a4031595493f';
        const s = document.createElement('script');
        s.defer = true;
        s.src = `https://static.cloudflareinsights.com/beacon.min.js?token=${token}`;
        s.dataset.cfBeacon = JSON.stringify({ token });
        document.body.append(s);
      }
    </script>
  </body>
</html>
